<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="card.css">
<style>
  body { display: flex; align-items: center; gap: 28px; }
  .lock { display: flex; align-items: center; gap: 13px; }
  .wm { font-weight: 600; font-size: 22px; letter-spacing: -0.6px; color: var(--ink); }
  .wm span { color: var(--ink-subtle); font-weight: 400; }
  .tag { font-family: var(--font-mono); font-size: 12px; color: var(--cyan-text); border-left: 1px solid var(--hairline); padding-left: 22px; }
</style></head>
<body>
  <div class="lock">
    <svg width="38" height="38" viewBox="0 0 32 32" fill="none">
      <line x1="7" y1="9" x2="20" y2="9" stroke="#33405A" stroke-width="1.5"/>
      <line x1="20" y1="9" x2="13" y2="23" stroke="#33405A" stroke-width="1.5"/>
      <circle cx="7" cy="9" r="3" fill="#6E8BFF"/>
      <circle cx="20" cy="9" r="3" fill="#53D0C5"/>
      <circle cx="13" cy="23" r="3" fill="#8B6DFF"/>
    </svg>
    <span class="wm">QuietFabric</span>
  </div>
  <div class="tag">Invisible systems.<br>Visible intelligence.</div>
</body></html>
