<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .sw { border: 1px solid var(--hairline); border-radius: var(--r-lg); overflow: hidden; background: var(--surface-1); }
  .sw .chip { height: 72px; }
  .sw .m { padding: 10px 12px; }
  .sw .n { font-size: 13px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 11px; color: var(--ink-subtle); margin-top: 2px; }
</style></head>
<body>
  <div class="lbl">Brand accents · reserved &amp; meaningful</div>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#6E8BFF"></div><div class="m"><div class="n">fabric-blue</div><div class="h">#6E8BFF · CTA / links</div></div></div>
    <div class="sw"><div class="chip" style="background:#53D0C5"></div><div class="m"><div class="n">quiet-cyan</div><div class="h">#53D0C5 · fabric</div></div></div>
    <div class="sw"><div class="chip" style="background:#8B6DFF"></div><div class="m"><div class="n">deep-violet</div><div class="h">#8B6DFF · model</div></div></div>
  </div>
</body></html>
