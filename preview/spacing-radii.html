<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .cell { text-align: center; }
  .box { background: var(--surface-2); border: 1px solid var(--hairline-strong); margin: 0 auto 8px; }
  .n { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); }
  .v { font-family: var(--font-mono); font-size: 10px; color: var(--ink-subtle); }
</style></head>
<body>
  <div class="lbl">Corner radii</div>
  <div class="grid">
    <div class="cell"><div class="box" style="width:64px;height:48px;border-radius:6px"></div><div class="n">sm</div><div class="v">6px</div></div>
    <div class="cell"><div class="box" style="width:64px;height:48px;border-radius:10px"></div><div class="n">md · buttons</div><div class="v">10px</div></div>
    <div class="cell"><div class="box" style="width:64px;height:48px;border-radius:14px"></div><div class="n">lg · cards</div><div class="v">14px</div></div>
    <div class="cell"><div class="box" style="width:64px;height:48px;border-radius:18px"></div><div class="n">xl · arch</div><div class="v">18px</div></div>
    <div class="cell"><div class="box" style="width:48px;height:48px;border-radius:9999px"></div><div class="n">full · pills</div><div class="v">9999px</div></div>
  </div>
</body></html>
