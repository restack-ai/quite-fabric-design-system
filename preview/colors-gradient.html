<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="card.css">
<style>
  .band { height: 86px; border-radius: var(--r-lg); border: 1px solid var(--hairline); }
  .fg { background: var(--fabric-gradient); }
  .sf { background: var(--gradient-signal-flow), var(--canvas-soft); margin-top: 10px; }
  .meta { display: flex; justify-content: space-between; margin-top: 8px; }
  .meta .n { font-size: 13px; font-weight: 500; }
  .meta .t { font-family: var(--font-mono); font-size: 11px; color: var(--cyan-text); }
</style></head>
<body>
  <div class="lbl">Gradients · signal flow, used sparingly</div>
  <div class="band fg"></div>
  <div class="meta"><span class="n">Fabric Gradient</span><span class="t">135° · blue → cyan → violet</span></div>
  <div class="band sf"></div>
  <div class="meta"><span class="n">Signal-Flow Ambient</span><span class="t">radial glow · hero / topology only</span></div>
</body></html>
