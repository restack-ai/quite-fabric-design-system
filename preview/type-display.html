<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="card.css">
<style>
  .row2 { display: grid; grid-template-columns: 96px 1fr; gap: 18px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
  .row2:last-child { border-bottom: none; }
  .k { font-family: var(--font-mono); font-size: 11px; color: var(--ink-subtle); }
  .k b { display: block; color: var(--ink-muted); font-weight: 500; }
  .d-xl { font-size: 52px; font-weight: 600; letter-spacing: -2.2px; line-height: 1.05; }
  .d-md { font-size: 36px; font-weight: 600; letter-spacing: -1.2px; line-height: 1.15; }
  .hl   { font-size: 26px; font-weight: 600; letter-spacing: -0.6px; }
</style></head>
<body>
  <div class="lbl">Display scale · Pretendard · negative tracking on large only</div>
  <div class="row2"><div class="k"><b>display-xl</b>72 / 600 / -2.6</div><div class="d-xl">Compute fabrics</div></div>
  <div class="row2"><div class="k"><b>display-md</b>40 / 600 / -1.2</div><div class="d-md">Routing the signal path</div></div>
  <div class="row2"><div class="k"><b>headline</b>28 / 600 / -0.6</div><div class="hl">Edge ingress to GPU pool</div></div>
</body></html>
