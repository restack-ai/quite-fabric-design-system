<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuietFabric — Component Previews</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--canvas, #05070B);
    color: var(--ink, #E6EAF2);
    font-family: var(--font-sans, system-ui, sans-serif);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 56px 24px 96px; }
  .top { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  a.back { color: var(--ink-muted, #8A93A6); text-decoration: none; font-size: 13px; }
  a.back:hover { color: var(--ink, #E6EAF2); }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .lead { color: var(--ink-muted, #8A93A6); font-size: 15px; max-width: 60ch; margin: 12px 0 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .tile {
    border: 1px solid var(--hairline, rgba(255,255,255,0.08));
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface-1, #0D111A);
  }
  .tile figcaption {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px;
    font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink-muted, #8A93A6);
    border-bottom: 1px solid var(--hairline, rgba(255,255,255,0.08));
  }
  .tile figcaption a { color: var(--fabric-blue, #4C7DFF); text-decoration: none; text-transform: none; letter-spacing: 0; }
  .tile iframe { display: block; width: 100%; height: 240px; border: 0; background: var(--canvas, #05070B); }
  .tile { margin: 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="back" href="../">← QuietFabric design system</a>
    </div>
    <h1>Component previews</h1>
    <p class="lead">Isolated specimens for individual tokens and components — color, type, spacing, and core UI surfaces. Each tile renders a standalone fragment; open any in full to inspect.</p>
    <div class="grid" id="grid"></div>
  </div>
  <script>
    const items = [
      ["brand-logo.html", "Brand · logo"],
      ["colors-neutrals.html", "Color · neutrals"],
      ["colors-accents.html", "Color · accents"],
      ["colors-semantic.html", "Color · semantic"],
      ["colors-gradient.html", "Color · gradient"],
      ["type-display.html", "Type · display"],
      ["type-body-mono.html", "Type · body & mono"],
      ["spacing-scale.html", "Spacing · scale"],
      ["spacing-radii.html", "Spacing · radii"],
      ["spacing-elevation.html", "Spacing · elevation"],
      ["components-buttons.html", "Components · buttons"],
      ["components-badges.html", "Components · badges"],
      ["components-cards.html", "Components · cards"],
      ["components-metrics.html", "Components · metrics"],
      ["components-architecture.html", "Components · architecture"],
    ];
    const grid = document.getElementById("grid");
    grid.innerHTML = items.map(([file, label]) => `
      <figure class="tile">
        <figcaption><span>${label}</span><a href="${file}" target="_blank" rel="noopener">open ↗</a></figcaption>
        <iframe src="${file}" loading="lazy" title="${label}"></iframe>
      </figure>`).join("");
  </script>
</body>
</html>
